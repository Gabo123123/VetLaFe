<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Veterinaria - LAFE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR STYLING */
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 15px;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-section h3 {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu button {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .sidebar-menu button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .sidebar-menu button.active {
            background: rgba(255, 255, 255, 0.3);
            border-left: 3px solid white;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background-color: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            color: #667eea;
            font-size: 28px;
        }

        .header-actions button {
            padding: 10px 20px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            transition: background-color 0.3s ease;
        }

        .header-actions button:hover {
            background-color: #764ba2;
        }

        /* CONTENT AREA */
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* CARDS STYLING */
        .client-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .client-info h3 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .client-info p {
            color: #666;
            font-size: 14px;
            margin: 3px 0;
        }

        .client-actions {
            display: flex;
            gap: 10px;
        }

        .client-actions button {
            padding: 8px 15px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s ease;
        }

        .client-actions button:hover {
            background-color: #764ba2;
        }

        .client-actions button.delete {
            background-color: #ff6b6b;
        }

        .client-actions button.delete:hover {
            background-color: #ee5a52;
        }

        /* PETS SECTION */
        .pets-section {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .pets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .pets-header h4 {
            color: #764ba2;
            font-size: 16px;
        }

        .pets-header button {
            padding: 6px 12px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s ease;
        }

        .pets-header button:hover {
            background-color: #667eea;
        }

        .pet-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid #764ba2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pet-info {
            flex: 1;
        }

        .pet-info p {
            font-size: 14px;
            color: #333;
            margin: 2px 0;
        }

        .pet-info strong {
            color: #764ba2;
        }

        .pet-actions {
            display: flex;
            gap: 8px;
        }

        .pet-actions button {
            padding: 6px 10px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.3s ease;
        }

        .pet-actions button:hover {
            background-color: #764ba2;
        }

        .pet-actions button.delete {
            background-color: #ff6b6b;
        }

        .pet-actions button.delete:hover {
            background-color: #ee5a52;
        }

        /* CONSULTATIONS TABLE */
        .consultations-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .consultations-table thead {
            background-color: #667eea;
            color: white;
        }

        .consultations-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        .consultations-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .consultations-table tbody tr {
            transition: background-color 0.3s ease;
        }

        .consultations-table tbody tr:hover {
            background-color: #f9f9f9;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pendiente {
            background-color: #ffd93d;
            color: #333;
        }

        .status-atendido {
            background-color: #6bcf7f;
            color: white;
        }

        .status-cancelado {
            background-color: #ff6b6b;
            color: white;
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .table-actions button {
            padding: 6px 10px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.3s ease;
        }

        .table-actions button:hover {
            background-color: #764ba2;
        }

        .table-actions button.delete {
            background-color: #ff6b6b;
        }

        .table-actions button.delete:hover {
            background-color: #ee5a52;
        }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .modal-header h3 {
            color: #667eea;
            font-size: 22px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #667eea;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #764ba2;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }

        .form-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .form-actions .submit-btn {
            background-color: #667eea;
            color: white;
        }

        .form-actions .submit-btn:hover {
            background-color: #764ba2;
        }

        .form-actions .cancel-btn {
            background-color: #e9ecef;
            color: #333;
        }

        .form-actions .cancel-btn:hover {
            background-color: #dee2e6;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* LOADING STATE */
        .loading {
            text-align: center;
            padding: 30px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* CONSULTA STEPS */
        .consulta-step {
            display: none;
        }

        .consulta-step.active {
            display: block;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 120px;
                padding: 10px;
            }

            .sidebar h1 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .sidebar-section {
                display: inline-block;
                margin-right: 20px;
            }

            .main-content {
                height: auto;
            }

            .content {
                overflow: visible;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }

            .header-actions {
                width: 100%;
                display: flex;
                gap: 10px;
            }

            .header-actions button {
                flex: 1;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h1>🐾 LAFE VET</h1>
            
            <div class="sidebar-section">
                <h3>Directorio</h3>
                <ul class="sidebar-menu">
                    <li><button class="menu-btn active" data-section="clientes">Clientes y Mascotas</button></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3>Consultas</h3>
                <ul class="sidebar-menu">
                    <li><button class="menu-btn" data-section="consultas">Citas y Fichas Médicas</button></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3>Administración</h3>
                <ul class="sidebar-menu">
                    <li><button class="menu-btn" data-section="estadisticas">Estadísticas</button></li>
                </ul>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- HEADER -->
            <div class="header">
                <h2 id="page-title">Clientes y Mascotas</h2>
                <div class="header-actions">
                    <button id="btn-new-client" class="action-btn">➕ Nuevo Cliente</button>
                </div>
            </div>

            <!-- CONTENT AREA -->
            <div class="content">
                <!-- CLIENTES SECTION -->
                <div class="content-section active" id="clientes-section">
                    <div id="clientes-container" class="clientes-container">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Cargando clientes...</p>
                        </div>
                    </div>
                </div>

                <!-- CONSULTAS SECTION -->
                <div class="content-section" id="consultas-section">
                    <div class="header-actions" style="margin-bottom: 20px;">
                        <button id="btn-new-consulta" class="action-btn">➕ Nueva Cita</button>
                    </div>
                    <div id="consultas-container" class="consultas-container">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Cargando citas...</p>
                        </div>
                    </div>
                </div>

                <!-- ESTADISTICAS SECTION -->
                <div class="content-section" id="estadisticas-section">
                    <div id="estadisticas-container" class="estadisticas-container">
                        <div class="empty-state">
                            <h3>📊 Estadísticas del Sistema</h3>
                            <p>Información estadística en desarrollo...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <!-- CLIENTE MODAL -->
    <div class="modal" id="modal-cliente">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-cliente-title">Nuevo Cliente</h3>
                <button class="close-btn" onclick="closeModal('modal-cliente')">&times;</button>
            </div>
            <form id="form-cliente">
                <div class="form-group">
                    <label for="cliente-dni">DNI/Cédula:</label>
                    <input type="text" id="cliente-dni" required placeholder="Ej: 12345678">
                </div>
                <div class="form-group">
                    <label for="cliente-nombre">Nombre Completo:</label>
                    <input type="text" id="cliente-nombre" required placeholder="Ej: Juan Pérez García">
                </div>
                <div class="form-group">
                    <label for="cliente-telefono">Teléfono:</label>
                    <input type="tel" id="cliente-telefono" placeholder="Ej: 555-1234567">
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal('modal-cliente')">Cancelar</button>
                    <button type="submit" class="submit-btn">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MASCOTA MODAL -->
    <div class="modal" id="modal-mascota">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nueva Mascota</h3>
                <button class="close-btn" onclick="closeModal('modal-mascota')">&times;</button>
            </div>
            <form id="form-mascota">
                <input type="hidden" id="mascota-cliente-id">
                <div class="form-group">
                    <label for="mascota-nombre">Nombre de la Mascota:</label>
                    <input type="text" id="mascota-nombre" required placeholder="Ej: Firulais">
                </div>
                <div class="form-group">
                    <label for="mascota-raza">Raza:</label>
                    <input type="text" id="mascota-raza" placeholder="Ej: Labrador Retriever">
                </div>
                <div class="form-group">
                    <label for="mascota-edad">Edad (años):</label>
                    <input type="number" id="mascota-edad" min="0" placeholder="Ej: 3">
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal('modal-mascota')">Cancelar</button>
                    <button type="submit" class="submit-btn">Guardar Mascota</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CONSULTA MODAL - Multi-paso -->
    <div class="modal" id="modal-consulta">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-consulta-title">Nueva Cita Médica</h3>
                <button class="close-btn" onclick="closeModal('modal-consulta')">&times;</button>
            </div>
            
            <!-- PASO 1: Seleccionar Cliente -->
            <div id="consulta-step1" class="consulta-step active">
                <div class="form-group">
                    <label for="consulta-cliente-select">Selecciona un Cliente:</label>
                    <select id="consulta-cliente-select" required>
                        <option value="">-- Cargando clientes --</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal('modal-consulta')">Cancelar</button>
                    <button type="button" class="submit-btn" onclick="irAlPaso2Consulta()">Siguiente</button>
                </div>
            </div>

            <!-- PASO 2: Seleccionar Mascota -->
            <div id="consulta-step2" class="consulta-step">
                <div class="form-group">
                    <label for="consulta-mascota-select">Selecciona una Mascota:</label>
                    <select id="consulta-mascota-select" required>
                        <option value="">-- Selecciona una mascota --</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="regresarAlPaso1Consulta()">Atrás</button>
                    <button type="button" class="submit-btn" onclick="irAlPaso3Consulta()">Siguiente</button>
                </div>
            </div>

            <!-- PASO 3: Datos de la Cita -->
            <div id="consulta-step3" class="consulta-step">
                <form id="form-consulta">
                    <input type="hidden" id="consulta-mascota-id">
                    <input type="hidden" id="consulta-id">
                    <div class="form-group">
                        <label for="consulta-fecha">Fecha y Hora:</label>
                        <input type="datetime-local" id="consulta-fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="consulta-motivo">Motivo de la Consulta:</label>
                        <input type="text" id="consulta-motivo" required placeholder="Ej: Revisión de rutina">
                    </div>
                    <div class="form-group">
                        <label for="consulta-peso">Peso (kg):</label>
                        <input type="number" id="consulta-peso" step="0.1" placeholder="Ej: 25.5">
                    </div>
                    <div class="form-group">
                        <label for="consulta-temperatura">Temperatura (°C):</label>
                        <input type="number" id="consulta-temperatura" step="0.1" placeholder="Ej: 38.5">
                    </div>
                    <div class="form-group">
                        <label for="consulta-sintomas">Síntomas:</label>
                        <textarea id="consulta-sintomas" placeholder="Describe los síntomas observados..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="consulta-diagnostico">Diagnóstico:</label>
                        <textarea id="consulta-diagnostico" placeholder="Diagnóstico del veterinario..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="consulta-receta">Receta/Tratamiento:</label>
                        <textarea id="consulta-receta" placeholder="Medicamentos y recomendaciones..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="consulta-estado">Estado:</label>
                        <select id="consulta-estado" required>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Atendido">Atendido</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="cancel-btn" onclick="regresarAlPaso2Consulta()">Atrás</button>
                        <button type="submit" class="submit-btn" id="submit-consulta-btn">Guardar Cita</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN PERSONALIZADO -->
    <div class="modal" id="modal-confirmation">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 id="confirmation-title">Confirmar</h3>
                <button class="close-btn" onclick="closeConfirmation()">&times;</button>
            </div>
            <div id="confirmation-message" style="padding: 20px; text-align: center; min-height: 60px;">
            </div>
            <div class="form-actions" style="gap: 10px;">
                <button type="button" class="cancel-btn" onclick="closeConfirmation()">Cancelar</button>
                <button type="button" class="submit-btn" id="confirmation-btn" onclick="confirmAction()">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE NOTIFICACIÓN PERSONALIZADO -->
    <div class="modal" id="modal-notification">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 id="notification-title">Notificación</h3>
                <button class="close-btn" onclick="closeNotification()">&times;</button>
            </div>
            <div id="notification-message" style="padding: 20px; text-align: center; min-height: 60px;">
            </div>
            <div class="form-actions">
                <button type="button" class="submit-btn" onclick="closeNotification()" style="width: 100%;">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080';

        // ==================== DOM ELEMENTS ====================
        const menuBtns = document.querySelectorAll('.menu-btn');
        const contentSections = document.querySelectorAll('.content-section');
        const clientesContainer = document.getElementById('clientes-container');
        const consultasContainer = document.getElementById('consultas-container');
        const btnNewClient = document.getElementById('btn-new-client');
        const btnNewConsulta = document.getElementById('btn-new-consulta');
        const formCliente = document.getElementById('form-cliente');
        const formMascota = document.getElementById('form-mascota');
        const formConsulta = document.getElementById('form-consulta');

        // ==================== EVENT LISTENERS ====================
        menuBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                menuBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const section = e.target.dataset.section;
                showSection(section);
            });
        });

        btnNewClient.addEventListener('click', () => {
            document.getElementById('modal-cliente-title').textContent = 'Nuevo Cliente';
            formCliente.reset();
            document.getElementById('cliente-dni').focus();
            openModal('modal-cliente');
        });

        btnNewConsulta.addEventListener('click', () => {
            abrirModalConsultaMultipaso();
        });

        formCliente.addEventListener('submit', async (e) => {
            e.preventDefault();
            await guardarCliente();
        });

        formMascota.addEventListener('submit', async (e) => {
            e.preventDefault();
            await guardarMascota();
        });

        formConsulta.addEventListener('submit', async (e) => {
            e.preventDefault();
            await guardarConsulta();
        });

        // ==================== SECTION NAVIGATION ====================
        function showSection(section) {
            contentSections.forEach(s => s.classList.remove('active'));
            document.getElementById(section + '-section').classList.add('active');

            const titles = {
                'clientes': 'Clientes y Mascotas',
                'consultas': 'Citas y Fichas Médicas',
                'estadisticas': 'Estadísticas del Sistema'
            };
            document.getElementById('page-title').textContent = titles[section];

            if (section === 'clientes') {
                btnNewClient.style.display = 'block';
                btnNewConsulta.style.display = 'none';
                cargarClientes();
            } else if (section === 'consultas') {
                btnNewClient.style.display = 'none';
                btnNewConsulta.style.display = 'block';
                cargarConsultas();
            } else {
                btnNewClient.style.display = 'none';
                btnNewConsulta.style.display = 'none';
            }
        }

        // ==================== MODAL FUNCTIONS ====================
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Modales personalizados
        let confirmCallback = null;

        function mostrarNotificacion(mensaje, titulo = '✓ Notificación') {
            document.getElementById('notification-title').textContent = titulo;
            document.getElementById('notification-message').textContent = mensaje;
            openModal('modal-notification');
        }

        function closeNotification() {
            closeModal('modal-notification');
        }

        function mostrarConfirmacion(mensaje, callback, titulo = '⚠️ Confirmar') {
            confirmCallback = callback;
            document.getElementById('confirmation-title').textContent = titulo;
            document.getElementById('confirmation-message').textContent = mensaje;
            openModal('modal-confirmation');
        }

        function closeConfirmation() {
            closeModal('modal-confirmation');
            confirmCallback = null;
        }

        function confirmAction() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmation();
        }

        // Flujo multi-paso para consultas
        async function abrirModalConsultaMultipaso() {
            document.getElementById('consulta-id').value = '';
            document.getElementById('consulta-mascota-id').value = '';
            document.getElementById('form-consulta').reset();
            
            // Cargar clientes en el paso 1
            await cargarClientesEnSelect();
            
            // Mostrar paso 1
            mostrarPasoConsulta(1);
            openModal('modal-consulta');
        }

        function mostrarPasoConsulta(paso) {
            document.getElementById('consulta-step1').classList.toggle('active', paso === 1);
            document.getElementById('consulta-step2').classList.toggle('active', paso === 2);
            document.getElementById('consulta-step3').classList.toggle('active', paso === 3);
        }

        async function cargarClientesEnSelect() {
            try {
                const response = await fetch(`${API_BASE_URL}/clientes`);
                const clientes = await response.json();
                
                const selectClientes = document.getElementById('consulta-cliente-select');
                selectClientes.innerHTML = '<option value="">-- Selecciona un cliente --</option>';
                
                clientes.forEach(cliente => {
                    const option = document.createElement('option');
                    option.value = cliente.id;
                    option.textContent = cliente.nombreCompleto + ' (DNI: ' + cliente.dni + ')';
                    selectClientes.appendChild(option);
                });
            } catch (error) {
                console.error('Error cargando clientes:', error);
                mostrarNotificacion('Error al cargar los clientes');
            }
        }

        async function irAlPaso2Consulta() {
            const clienteId = document.getElementById('consulta-cliente-select').value;
            
            if (!clienteId) {
                mostrarNotificacion('Por favor selecciona un cliente');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/mascotas/cliente/${clienteId}`);
                const mascotas = await response.json();
                
                if (mascotas.length === 0) {
                    mostrarNotificacion('Este cliente no tiene mascotas registradas. Por favor, agrega una mascota primero.');
                    return;
                }

                const selectMascotas = document.getElementById('consulta-mascota-select');
                selectMascotas.innerHTML = '<option value="">-- Selecciona una mascota --</option>';
                
                mascotas.forEach(mascota => {
                    const option = document.createElement('option');
                    option.value = mascota.id;
                    option.textContent = mascota.nombre + ' (' + (mascota.raza || 'Raza no especificada') + ')';
                    selectMascotas.appendChild(option);
                });

                mostrarPasoConsulta(2);
            } catch (error) {
                console.error('Error cargando mascotas:', error);
                mostrarNotificacion('Error al cargar las mascotas del cliente');
            }
        }

        function regresarAlPaso1Consulta() {
            mostrarPasoConsulta(1);
        }

        function irAlPaso3Consulta() {
            const mascotaId = document.getElementById('consulta-mascota-select').value;
            
            if (!mascotaId) {
                mostrarNotificacion('Por favor selecciona una mascota');
                return;
            }

            document.getElementById('consulta-mascota-id').value = mascotaId;
            mostrarPasoConsulta(3);
        }

        function regresarAlPaso2Consulta() {
            mostrarPasoConsulta(2);
        }

        window.onclick = (event) => {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        };

        // ==================== API FUNCTIONS ====================
        async function cargarClientes() {
            try {
                clientesContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando clientes...</p></div>';
                const response = await fetch(`${API_BASE_URL}/clientes`);
                const clientes = await response.json();

                if (clientes.length === 0) {
                    clientesContainer.innerHTML = '<div class="empty-state"><h3>Sin clientes</h3><p>No hay clientes registrados. Crea uno nuevo para empezar.</p></div>';
                    return;
                }

                clientesContainer.innerHTML = '';
                for (const cliente of clientes) {
                    const mascotas = await fetch(`${API_BASE_URL}/mascotas/cliente/${cliente.id}`).then(r => r.json());
                    const card = crearTarjetaCliente(cliente, mascotas);
                    clientesContainer.appendChild(card);
                }
            } catch (error) {
                console.error('Error cargando clientes:', error);
                clientesContainer.innerHTML = '<div class="empty-state"><h3>Error</h3><p>No se pudieron cargar los clientes.</p></div>';
            }
        }

        async function cargarConsultas() {
            try {
                consultasContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando citas...</p></div>';
                const response = await fetch(`${API_BASE_URL}/consultas`);
                const consultas = await response.json();

                if (consultas.length === 0) {
                    consultasContainer.innerHTML = '<div class="empty-state"><h3>Sin citas</h3><p>No hay citas médicas registradas.</p></div>';
                    return;
                }

                const tabla = crearTablaConsultas(consultas);
                consultasContainer.innerHTML = '';
                consultasContainer.appendChild(tabla);
            } catch (error) {
                console.error('Error cargando consultas:', error);
                consultasContainer.innerHTML = '<div class="empty-state"><h3>Error</h3><p>No se pudieron cargar las citas.</p></div>';
            }
        }

        async function guardarCliente() {
            const dni = document.getElementById('cliente-dni').value;
            const nombre = document.getElementById('cliente-nombre').value;
            const telefono = document.getElementById('cliente-telefono').value;

            try {
                const response = await fetch(`${API_BASE_URL}/clientes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dni, nombreCompleto: nombre, telefono })
                });

                if (response.ok) {
                    mostrarNotificacion('Cliente guardado correctamente');
                    closeModal('modal-cliente');
                    cargarClientes();
                } else {
                    mostrarNotificacion('Error al guardar el cliente');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarNotificacion('Error al guardar el cliente');
            }
        }

        async function guardarMascota() {
            const clienteId = document.getElementById('mascota-cliente-id').value;
            const nombre = document.getElementById('mascota-nombre').value;
            const raza = document.getElementById('mascota-raza').value;
            const edad = document.getElementById('mascota-edad').value;

            try {
                const response = await fetch(`${API_BASE_URL}/mascotas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, raza, edad: edad ? parseInt(edad) : null, clienteId: parseInt(clienteId) })
                });

                if (response.ok) {
                    mostrarNotificacion('Mascota guardada correctamente');
                    closeModal('modal-mascota');
                    cargarClientes();
                } else {
                    mostrarNotificacion('Error al guardar la mascota');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarNotificacion('Error al guardar la mascota');
            }
        }

        async function guardarConsulta() {
            const mascotaId = document.getElementById('consulta-mascota-id').value;
            const consultaId = document.getElementById('consulta-id').value;
            const fecha = document.getElementById('consulta-fecha').value;
            const motivo = document.getElementById('consulta-motivo').value;
            const peso = document.getElementById('consulta-peso').value;
            const temperatura = document.getElementById('consulta-temperatura').value;
            const sintomas = document.getElementById('consulta-sintomas').value;
            const diagnostico = document.getElementById('consulta-diagnostico').value;
            const receta = document.getElementById('consulta-receta').value;
            const estado = document.getElementById('consulta-estado').value;

            if (!fecha || !motivo) {
                mostrarNotificacion('Por favor completa los campos requeridos');
                return;
            }

            const consultaData = {
                fechaHora: fecha,
                motivo,
                peso: peso ? parseFloat(peso) : null,
                temperatura: temperatura ? parseFloat(temperatura) : null,
                sintomas,
                diagnostico,
                receta,
                estado
            };

            try {
                let response;
                if (consultaId) {
                    response = await fetch(`${API_BASE_URL}/consultas/${consultaId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(consultaData)
                    });
                } else {
                    response = await fetch(`${API_BASE_URL}/consultas`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...consultaData, mascotaId: parseInt(mascotaId) })
                    });
                }

                if (response.ok) {
                    mostrarNotificacion('Cita guardada correctamente');
                    closeModal('modal-consulta');
                    cargarConsultas();
                } else {
                    mostrarNotificacion('Error al guardar la cita');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarNotificacion('Error al guardar la cita');
            }
        }

        async function eliminarCliente(clienteId) {
            mostrarConfirmacion(
                '¿Estás seguro de que deseas eliminar este cliente y todas sus mascotas?',
                async () => {
                    try {
                        const response = await fetch(`${API_BASE_URL}/clientes/${clienteId}`, { method: 'DELETE' });
                        if (response.ok) {
                            mostrarNotificacion('Cliente eliminado');
                            cargarClientes();
                        } else {
                            mostrarNotificacion('Error al eliminar el cliente');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        mostrarNotificacion('Error al eliminar el cliente');
                    }
                }
            );
        }

        async function eliminarMascota(mascotaId) {
            mostrarConfirmacion(
                '¿Estás seguro de que deseas eliminar esta mascota?',
                async () => {
                    try {
                        const response = await fetch(`${API_BASE_URL}/mascotas/${mascotaId}`, { method: 'DELETE' });
                        if (response.ok) {
                            mostrarNotificacion('Mascota eliminada');
                            cargarClientes();
                        } else {
                            mostrarNotificacion('Error al eliminar la mascota');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        mostrarNotificacion('Error al eliminar la mascota');
                    }
                }
            );
        }

        async function eliminarConsulta(consultaId) {
            mostrarConfirmacion(
                '¿Estás seguro de que deseas eliminar esta cita?',
                async () => {
                    try {
                        const response = await fetch(`${API_BASE_URL}/consultas/${consultaId}`, { method: 'DELETE' });
                        if (response.ok) {
                            mostrarNotificacion('Cita eliminada');
                            cargarConsultas();
                        } else {
                            mostrarNotificacion('Error al eliminar la cita');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        mostrarNotificacion('Error al eliminar la cita');
                    }
                }
            );
        }

        async function editarConsulta(consultaId) {
            try {
                const response = await fetch(`${API_BASE_URL}/consultas/${consultaId}`);
                const consulta = await response.json();
                
                document.getElementById('consulta-id').value = consulta.id;
                document.getElementById('consulta-mascota-id').value = consulta.mascota.id;
                document.getElementById('consulta-fecha').value = consulta.fechaHora;
                document.getElementById('consulta-motivo').value = consulta.motivo || '';
                document.getElementById('consulta-peso').value = consulta.peso || '';
                document.getElementById('consulta-temperatura').value = consulta.temperatura || '';
                document.getElementById('consulta-sintomas').value = consulta.sintomas || '';
                document.getElementById('consulta-diagnostico').value = consulta.diagnostico || '';
                document.getElementById('consulta-receta').value = consulta.receta || '';
                document.getElementById('consulta-estado').value = consulta.estado;
                
                document.getElementById('modal-consulta-title').textContent = 'Editar Cita Médica';
                document.getElementById('submit-consulta-btn').textContent = 'Actualizar Cita';
                openModal('modal-consulta');
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar la cita');
            }
        }

        // ==================== UI BUILDERS ====================
        function crearTarjetaCliente(cliente, mascotas) {
            const card = document.createElement('div');
            card.className = 'client-card';

            let mascotasHTML = '';
            if (mascotas.length > 0) {
                mascotasHTML = mascotas.map(mascota => `
                    <div class="pet-item">
                        <div class="pet-info">
                            <p><strong>🐾 ${mascota.nombre}</strong></p>
                            <p>Raza: ${mascota.raza || 'No especificada'} | Edad: ${mascota.edad || '?'} años</p>
                        </div>
                        <div class="pet-actions">
                            <button onclick="editarMascota(${mascota.id}, '${mascota.nombre}', '${mascota.raza}', ${mascota.edad})">Editar</button>
                            <button class="delete" onclick="eliminarMascota(${mascota.id})">Eliminar</button>
                        </div>
                    </div>
                `).join('');
            }

            card.innerHTML = `
                <div class="client-header">
                    <div class="client-info">
                        <h3>👤 ${cliente.nombreCompleto}</h3>
                        <p>DNI: ${cliente.dni}</p>
                        <p>Teléfono: ${cliente.telefono || 'No especificado'}</p>
                    </div>
                    <div class="client-actions">
                        <button onclick="editarCliente(${cliente.id}, '${cliente.dni}', '${cliente.nombreCompleto}', '${cliente.telefono}')">Editar</button>
                        <button class="delete" onclick="eliminarCliente(${cliente.id})">Eliminar</button>
                    </div>
                </div>
                <div class="pets-section">
                    <div class="pets-header">
                        <h4>Mascotas (${mascotas.length})</h4>
                        <button onclick="abrirModalMascota(${cliente.id})">+ Agregar</button>
                    </div>
                    ${mascotasHTML || '<p style="color: #999;">Sin mascotas registradas</p>'}
                </div>
            `;
            return card;
        }

        function crearTablaConsultas(consultas) {
            const tabla = document.createElement('table');
            tabla.className = 'consultations-table';

            tabla.innerHTML = `
                <thead>
                    <tr>
                        <th>Fecha/Hora</th>
                        <th>Mascota</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    ${consultas.map(c => `
                        <tr>
                            <td>${new Date(c.fechaHora).toLocaleString('es-ES')}</td>
                            <td>${c.mascota.nombre}</td>
                            <td>${c.motivo}</td>
                            <td><span class="status-badge status-${c.estado.toLowerCase()}">${c.estado}</span></td>
                            <td>
                                <div class="table-actions">
                                    <button onclick="editarConsulta(${c.id})">Ver/Editar</button>
                                    <button class="delete" onclick="eliminarConsulta(${c.id})">Eliminar</button>
                                </div>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
            return tabla;
        }

        function abrirModalMascota(clienteId) {
            document.getElementById('mascota-cliente-id').value = clienteId;
            formMascota.reset();
            openModal('modal-mascota');
        }

        function editarCliente(id, dni, nombre, telefono) {
            document.getElementById('modal-cliente-title').textContent = 'Editar Cliente';
            document.getElementById('cliente-dni').value = dni;
            document.getElementById('cliente-nombre').value = nombre;
            document.getElementById('cliente-telefono').value = telefono;
            openModal('modal-cliente');
        }

        function editarMascota(id, nombre, raza, edad) {
            document.getElementById('mascota-nombre').value = nombre;
            document.getElementById('mascota-raza').value = raza;
            document.getElementById('mascota-edad').value = edad;
            openModal('modal-mascota');
        }

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            cargarClientes();
        });
    </script>
</body>
</html>
